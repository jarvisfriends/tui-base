sonar.projectKey=jarvisfriends_tui-base
sonar.organization=jarvisfriends

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=tui-base
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Coverage report produced by `go test -coverprofile=coverage.out` in
# .github/workflows/sonarqube.yml, so SonarCloud can display line coverage
# alongside its own static analysis.
sonar.go.coverage.reportPaths=coverage.out
