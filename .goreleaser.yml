version: 2

project_name: tui-base

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: tui-base
    binary: tui-base
    main: ./cmd/tui-base
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jarvisfriends/tui-base/common.appVersion={{.Version}}
  - id: multipage
    binary: multipage
    main: ./examples/multipage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
  - id: minimal
    binary: minimal
    main: ./examples/minimal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
  - id: dashboard
    binary: dashboard
    main: ./examples/dashboard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

# One archive per binary (not one combined archive per OS/arch): each example
# app is a standalone, runnable reference app (examples/USAGE.md explains what
# each one demos), so it ships as its own tui-base_<binary>_<os>_<arch>
# download instead of bundling every binary together under one name.
archives:
  - id: tui-base
    ids: [tui-base]
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - CHANGELOG.md
      - src: examples/USAGE.md
        dst: USAGE.md
  - id: multipage
    ids: [multipage]
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - CHANGELOG.md
      - src: examples/USAGE.md
        dst: USAGE.md
  - id: minimal
    ids: [minimal]
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - CHANGELOG.md
      - src: examples/USAGE.md
        dst: USAGE.md
  - id: dashboard
    ids: [dashboard]
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - CHANGELOG.md
      - src: examples/USAGE.md
        dst: USAGE.md

checksum:
  name_template: "checksums.txt"

# I-8 supply-chain hardening (Q-17: cosign keyless/OIDC).
# SBOMs: one SPDX JSON per archive, attached to the release.
sboms:
  - artifacts: archive

# Sign the checksum file keylessly; verifying it transitively verifies every
# archive (their hashes are inside). Requires the workflow to grant
# id-token: write and have cosign installed. COSIGN_YES skips the interactive
# transparency-log prompt in CI.
signs:
  - cmd: cosign
    artifacts: checksum
    output: false
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  github:
    owner: jarvisfriends
    name: tui-base

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
