version: 2

project_name: tui-base

before:
  hooks:
    - go mod tidy
    - go generate ./...

# -s -w strips debug symbols (smaller release binaries) and -X injects the
# release tag into common.appVersion — shared by the main binary AND every
# example (they all import tui-base's router/common), so each distributed
# binary reports the correct version consistently. Shape factored into
# &example_build; each entry below only overrides id/binary/main.
builds:
  - &example_build
    id: tui-base
    binary: tui-base
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jarvisfriends/tui-base/common.appVersion={{.Version}}
  - <<: *example_build
    id: multipage
    binary: multipage
    main: ./examples/multipage
  - <<: *example_build
    id: minimal
    binary: minimal
    main: ./examples/minimal
  - <<: *example_build
    id: dashboard
    binary: dashboard
    main: ./examples/dashboard

# One archive per binary (not one combined archive per OS/arch): each example
# app is a standalone, runnable reference app (examples/USAGE.md explains what
# each one demos), so it ships as its own tui-base_<binary>_<os>_<arch>
# download instead of bundling every binary together under one name. Shape
# factored into &example_archive; each entry below only overrides id/ids.
archives:
  - &example_archive
    id: tui-base
    ids: [tui-base]
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - CHANGELOG.md
      - src: examples/USAGE.md
        dst: USAGE.md
  - <<: *example_archive
    id: multipage
    ids: [multipage]
  - <<: *example_archive
    id: minimal
    ids: [minimal]
  - <<: *example_archive
    id: dashboard
    ids: [dashboard]

checksum:
  name_template: "checksums.txt"

# I-8 supply-chain hardening (Q-17: cosign keyless/OIDC).
# SBOMs: one SPDX JSON per archive, attached to the release.
sboms:
  - artifacts: archive

# Sign the checksum file keylessly; verifying it transitively verifies every
# archive (their hashes are inside). Requires the workflow to grant
# id-token: write and have cosign installed. COSIGN_YES skips the interactive
# transparency-log prompt in CI.
signs:
  - cmd: cosign
    artifacts: checksum
    output: false
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  github:
    owner: jarvisfriends
    name: tui-base
  # The README gallery points at releases/latest/download/<name>.gif.
  # release.yml renders the tapes and moves the gifs to demo-gifs/ before
  # goreleaser starts (they cannot stay in dist/: --clean wipes it, and a
  # before hook runs too early to survive the dist check).
  extra_files:
    - glob: demo-gifs/*.gif

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
