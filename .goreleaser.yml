version: 2

project_name: tui-base

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: tui-base
    binary: tui-base
    main: ./
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ .Tag }}"

release:
  github:
    owner: amarcum
    name: tui-base

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
