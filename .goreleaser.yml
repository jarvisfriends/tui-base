version: 2

project_name: tui-base

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: tui-base
    binary: tui-base
    main: ./cmd/tui-base
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jarvisfriends/tui-base/common.appVersion={{.Version}}
  - id: multipage
    binary: multipage
    main: ./examples/multipage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

# I-8 supply-chain hardening (Q-17: cosign keyless/OIDC).
# SBOMs: one SPDX JSON per archive, attached to the release.
sboms:
  - artifacts: archive

# Sign the checksum file keylessly; verifying it transitively verifies every
# archive (their hashes are inside). Requires the workflow to grant
# id-token: write and have cosign installed. COSIGN_YES skips the interactive
# transparency-log prompt in CI.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  github:
    owner: jarvisfriends
    name: tui-base

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
