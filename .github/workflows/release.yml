name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Run CI before release
    uses: ./.github/workflows/ci.yml

  release:
    name: goreleaser
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Install stringer
        # Pinned (CI-1): bump alongside the golang.org/x/tools dependency.
        run: go install golang.org/x/tools/cmd/stringer@v0.47.0
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned (CI-1): releases must be reproducible.
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
