name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Run CI before release
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  release:
    name: goreleaser
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # I-8: keyless cosign signing needs an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Install stringer
        # Pinned (CI-1): bump alongside the golang.org/x/tools dependency.
        run: go install golang.org/x/tools/cmd/stringer@v0.47.0
      - name: Install cosign
        # I-8 (Q-17): keyless OIDC signing of the release checksum file.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign-installer v4 only installs cosign >= v2.6, which default to the
          # new Sigstore bundle format. The goreleaser signs block writes a single
          # ${artifact}.sigstore.json bundle (--bundle) to match.
          cosign-release: 'v3.0.6'
      - name: Install syft
        # I-8: SBOM generation for goreleaser's sboms section.
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # The README gallery links releases/latest/download/<name>.gif, so the
      # tag has to carry the gifs. Immutable releases can only attach assets
      # while the release is created — goreleaser does that via
      # release.extra_files, and this renders them for it. (Flow ported from
      # snap's release.yml.)
      - name: Render demo gifs
        run: go -C tools/rendertapes run .
      - name: Stage gifs for the release
        # Out of dist/ before goreleaser runs: --clean empties dist/, and a
        # before hook cannot write there either (it runs ahead of the
        # "ensuring distribution directory" step, which then refuses a
        # non-empty dist). demo-gifs/ is gitignored so the tree stays clean
        # for goreleaser's dirty check.
        run: |
          set -euo pipefail
          mkdir -p demo-gifs
          mv dist/*.gif demo-gifs/
          rm -rf dist
          # Fail here rather than trusting goreleaser to notice: an
          # extra_files glob is only resolved at publish time, and a release
          # that ships without gifs leaves the README gallery 404ing for good
          # — immutable releases mean it cannot be patched afterwards.
          staged=$(find demo-gifs -maxdepth 1 -name '*.gif' | wc -l)
          tapes=$(find . -name '*.tape' -not -path './tools/*' -not -path './.git/*' | wc -l)
          if [ "$staged" -ne "$tapes" ]; then
            echo "::error::staged $staged gif(s) for $tapes tape(s); refusing to release a broken gallery"
            exit 1
          fi
          echo "staged $staged gif(s) for the release"
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # Pinned (CI-1): releases must be reproducible.
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
