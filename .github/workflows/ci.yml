name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_call: # allow release.yml to require CI to pass before releasing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS included (CI-2): darwin binaries are released, and
        # disk_unix.go has a Darwin-specific int32/int64 divergence that only
        # a darwin build+test run exercises.
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build
        run: go build ./...
      - name: Test (race)
        run: go test -race ./... -v
      - name: Vet
        run: go vet ./...
      - name: gofmt check
        if: matrix.os == 'ubuntu-24.04'
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt drift detected:"
            echo "$files"
            exit 1
          fi
      - name: go mod tidy check
        if: matrix.os == 'ubuntu-24.04'
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go mod tidy would change files — run 'go mod tidy' and commit the result"
            exit 1
          fi
      - name: go mod verify
        if: matrix.os == 'ubuntu-24.04'
        run: go mod verify

  go-generate:
    name: go generate drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Install stringer
        # Pinned (CI-1): bump alongside the golang.org/x/tools dependency.
        run: go install golang.org/x/tools/cmd/stringer@v0.47.0
      - name: Check for go generate drift
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "go generate produced changes — run 'go generate ./...' locally and commit the result"
            exit 1
          fi

  go-fix:
    name: go fix drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Check for go fix drift
        run: |
          if ! go fix -diff ./...; then
            echo "go fix found suggestions — run 'go fix ./...' locally, review the diff, and commit the result"
            exit 1
          fi

  lint:
    name: Lint (target GOOS=${{ matrix.target_goos }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target_goos: [linux, windows]
    env:
      GOOS: ${{ matrix.target_goos }}
      GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned (CI-1): keep in sync with tools/local_verify.sh and the
          # coverage job below.
          version: v2.13.1
      - name: Lint releasetag (nested module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: tools/releasetag
      - name: Lint rendertapes (nested module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: tools/rendertapes

  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1

  docs:
    name: Docs Lint and Links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: |
            **/*.md
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        env:
          # Authenticated GitHub requests avoid the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail: true
          # Retry/UA/accept policy lives in lychee.toml (browser user agent so
          # bot-blocking hosts don't TCP-reset the check; redirects followed,
          # final status must be 2xx).
          args: --no-progress --verbose --config lychee.toml "./**/*.md"

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shellcheck scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './'

  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
      - name: Run govulncheck
        run: govulncheck ./...

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Run fuzz targets (30s each)
        # Short timed runs per target catch shallow regressions on every PR
        env:
          FUZZTIME: 30s
        run: bash tools/fuzz.sh

  bench:
    name: Benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Run benchmarks
        # results are uploaded for trend comparison
        # (e.g. benchstat old.txt new.txt locally); no thresholds enforced —
        # shared runners are too noisy for hard gates.
        run: go test ./... -run '^$' -bench=. -benchmem -count=1 | tee bench.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmarks
          path: bench.txt

  release-snapshot:
    name: GoReleaser snapshot (packaging check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Install stringer
        # needed by the goreleaser before-hook (go generate).
        run: go install golang.org/x/tools/cmd/stringer@v0.47.0
      - name: GoReleaser snapshot build
        # Catches packaging failures (bad main path, ldflags, matrix) on every
        # PR. Nothing is published.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.16.0
          # sign/sbom skipped: cosign+syft only install in the release workflow (I-8)
          args: release --snapshot --clean --skip=publish,sign,sbom

  coverage:
    name: Coverage (ubuntu)
    runs-on: ubuntu-24.04
    needs: [verify, lint]
    env:
      COVERAGE_THRESHOLD: 62.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Run coverage script
        # SKIP_LINT: the lint job already ran golangci-lint on this commit,
        # and the script's race-enabled test run produces the coverage profile
        # itself — no separate test step needed (CI-7).
        env:
          SKIP_LINT: "1"
        run: bash tools/test_coverage.sh
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
      - name: Upload coverage to Coveralls
        # Non-fatal: no-op until the repo is connected on coveralls.io. Pinned by
        # commit SHA (Sonar S8545: no unpinned "go install"); uses goveralls via
        # the workflow GITHUB_TOKEN on public repos.
        continue-on-error: true
        uses: shogo82148/actions-goveralls@8781f5dd05b691c4dd042d5e859c11c73e0104fa # v1.11.1
        with:
          path-to-profile: coverage.out
      - name: Upload coverage reports to Codecov
        # Requires the CODECOV_TOKEN secret; without it the action attempts a
        # tokenless upload on public repos and does not fail the build.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jarvisfriends/tui-base
          files: ./coverage.out
      - name: Check coverage threshold
        run: |
          cov=$(cat coverage.txt)
          echo "Coverage reported: $cov"
          percent=$(echo "$cov" | tr -d '%')
          awk -v p="$percent" -v t="${COVERAGE_THRESHOLD}" 'BEGIN { if (p+0 < t+0) { print "Coverage " p "% is below threshold " t "%"; exit 1 } else { print "Coverage " p "% meets threshold " t "%" } }'
