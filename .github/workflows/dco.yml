name: DCO

# Developer Certificate of Origin check (OpenSSF Best Practices 'dco'
# criterion): every commit in a PR must carry a Signed-off-by trailer
# matching its author, certifying the contributor has the right to submit
# the change under this project's license (developercertificate.org).
#
# Bot-authored commits (Dependabot, github-actions, etc. — emails ending in
# "[bot]@users.noreply.github.com") are exempt: automation cannot certify
# the DCO, and exempting bots is standard practice, so their PRs can go
# green on this check when everything else passes.
#
# A plain inline shell check (not a third-party Action) keeps this in the
# same supply-chain posture as the rest of CI — nothing new to pin or trust.

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  check-signoff:
    name: Check commits are signed off
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify every commit has a matching Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email=$(git show -s --format='%ae' "$sha")
            subject=$(git show -s --format='%s' "$sha")
            # Bots (Dependabot, github-actions, …) cannot certify the DCO.
            # Quoted RHS keeps the [bot] brackets literal, not a glob class.
            if [[ "$email" == *'[bot]@users.noreply.github.com' ]]; then
              echo "commit ${sha:0:12} authored by bot ($email) — DCO exempt"
              continue
            fi
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qiF "<${email}>"; then
              echo "::error::commit ${sha:0:12} (\"$subject\") has no Signed-off-by trailer matching $email"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Every commit must certify the Developer Certificate of Origin:"
            echo "  git commit --signoff          # sign off a new commit"
            echo "  git commit --amend --signoff  # sign off the last commit"
            echo "  git rebase --signoff main     # sign off a whole branch"
            echo "See CONTRIBUTING.md and https://developercertificate.org/"
            exit 1
          fi
