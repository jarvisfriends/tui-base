name: Auto-release

# Turns a merge to the default branch into a release decision using gorelease's
# API-compatibility analysis (the logic lives in tools/releasetag, not in shell):
#
#   • On a pull request it posts a comment describing what will happen on merge.
#   • On merge, a backward-compatible change is auto-tagged as a patch. A minor
#     or major bump is never auto-tagged — it is surfaced (with the reason) for a
#     maintainer to approve by pushing the tag.
#
# The patch tag this creates is what fires release.yml (goreleaser). A tag pushed
# with the default GITHUB_TOKEN does NOT trigger other workflows, so the tag job
# checks out with RELEASE_PAT when it is set (a repo/personal access token with
# `contents: write`). Without it the tag is still created, but release.yml must
# be run manually for that tag.

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # PR preview — comments the plan, never tags.
  plan:
    name: Release plan (PR preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # post the "what will happen on merge" comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gorelease needs full history + tags
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - name: Install gorelease
        # @latest mirrors tools/local_verify.sh.
        run: go install golang.org/x/exp/cmd/gorelease@latest
      - name: Plan release
        run: |
          go build -C tools/releasetag -o "$RUNNER_TEMP/releasetag" .
          "$RUNNER_TEMP/releasetag" -mode plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Merge — require CI to pass, then auto-tag a patch (or surface minor/major).
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  tag:
    name: Auto-tag patch
    if: github.event_name == 'push'
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # RELEASE_PAT so the pushed tag triggers release.yml; falls back to the
          # default token (tag created, release.yml then run manually).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@latest
      - name: Apply release
        run: |
          go build -C tools/releasetag -o "$RUNNER_TEMP/releasetag" .
          "$RUNNER_TEMP/releasetag" -mode apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
