<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    tui-base master app icon.

    This SVG is the single source of truth for the brand mark. Editing it and
    running `go generate ./...` (or the tools/genicon tool directly) regenerates
    assets/icon.ico and the embedded Windows resource under cmd/tui-base.

    Consumers branding their own app should copy this file, restyle it, and point
    the generator at their copy - see docs/branding.md. Keep the artwork to solid
    fills, rounded rects, simple paths, and linear gradients: the generator uses
    a lightweight SVG rasterizer (oksvg) that does not implement the full SVG
    spec (no CSS, filters, or patterns).
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A6BFF"/>
      <stop offset="1" stop-color="#4B33C7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="48" x2="0" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#221D3A"/>
      <stop offset="1" stop-color="#171327"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="256" height="256" rx="58" ry="58" fill="url(#tile)"/>

  <!-- terminal screen -->
  <rect x="40" y="48" width="176" height="160" rx="26" ry="26" fill="url(#screen)"/>

  <!-- title-bar accent -->
  <rect x="66" y="72" width="52" height="9" rx="4.5" ry="4.5" fill="#5B4CA8"/>

  <!-- prompt chevron -->
  <path d="M78 116 L108 140 L78 164" fill="none" stroke="#8EE6C8" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- underscore cursor -->
  <rect x="120" y="152" width="52" height="14" rx="7" ry="7" fill="#8A6BFF"/>

  <!-- foundation / base bar -->
  <rect x="72" y="188" width="112" height="7" rx="3.5" ry="3.5" fill="#3B3260"/>
</svg>
